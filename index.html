<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Gradient Fun</title>
        <link rel="stylesheet" href="style.css">
    </head>
  <body>
    <main>
        <h2>Linear Gradient</h2>       
        <div class="gradient-container">
            <div class="grade-div linear-gradient-one"></div>
            <div class="grade-div linear-gradient-two"></div>
            <div class="grade-div linear-gradient-three"></div>
        </div>

        <h2>Radial Gradient</h2>       
        <div class="gradient-container">
            <div class="grade-div radial-gradient-one"></div>
            <div class="grade-div radial-gradient-two"></div>
        </div>

        <h2>Conic Gradient</h2>       
        <div class="gradient-container">
            <div class="grade-div conic-gradient-one"></div>
        </div>

        <h2>Practical Example</h2>
        <div class="gradient-container">
            <button class="gradient-button">Example</button>
        </div>
        
    </main>
  </body>
</html>
